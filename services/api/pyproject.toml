[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-osce-api"
version = "0.1.0"
description = "FastAPI and LangGraph backend for 临境 OSCE 智能体（TraceOSCE）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "langgraph>=0.6.0,<1.0.0",
  "langchain-anthropic>=0.3.0,<1.0.0",
  "pydantic-settings>=2.14.2,<3.0.0",
  "starlette>=1.3.1,<2.0.0",
  "sqlmodel>=0.0.22,<1.0.0",
  "chromadb>=1.0.0,<2.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "google-genai>=1.33.0,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "huggingface-hub>=0.35.0,<1.0.0",
  "datasets>=4.0.0,<5.0.0",
  "pandas>=2.2.0,<3.0.0",
  "pyarrow>=20.0.0,<30.0.0",
  "unstructured>=0.18.0,<1.0.0",
  "markdown>=3.10.0,<4.0.0",
  "pdfminer-six>=20251230,<20270000",
  "pypdf>=6.14.2,<7.0.0",
  "pillow>=12.3.0,<13.0.0",
  "aiohttp>=3.14.1,<4.0.0",
  "cryptography>=48.0.1,<49.0.0",
  "urllib3>=2.7.0,<3.0.0",
  "python-docx>=1.2.0,<2.0.0",
  "python-pptx>=1.0.0,<2.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "beautifulsoup4>=4.12.0,<5.0.0",
  "lxml>=5.0.0,<7.0.0",
  "fastembed>=0.7.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
