name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install API dependencies
        run: uv sync --frozen --extra dev

      - name: Run API tests
        run: uv run python3 -m pytest -q tests ../../tests

  web:
    name: Student web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install student web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check student web
        run: pnpm check

  admin:
    name: Admin web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml

      - name: Install admin web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check admin web
        run: pnpm check

  e2e:
    name: Critical browser flow
    needs:
      - api
      - web
      - admin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_STUDENT_BASE_URL: http://localhost:3000
      E2E_ADMIN_BASE_URL: http://127.0.0.1:3001
      E2E_STUDENT_EMAIL: student@e2e.test
      E2E_STUDENT_PASSWORD: traceosce-e2e-student-only
      E2E_ADMIN_EMAIL: admin@e2e.test
      E2E_ADMIN_PASSWORD: traceosce-e2e-admin-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install student web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Start isolated E2E stack
        run: docker compose -f docker-compose.e2e.yml up --build --wait --wait-timeout 240

      - name: Run critical training flow
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Collect E2E service logs
        if: always()
        run: |
          mkdir -p apps/web/test-results
          docker compose -f docker-compose.e2e.yml ps --all > apps/web/test-results/docker-compose-ps.log 2>&1 || true
          docker compose -f docker-compose.e2e.yml logs --no-color > apps/web/test-results/docker-compose.log 2>&1 || true

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-browser-flow-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/web/test-results
            apps/web/playwright-report

      - name: Stop isolated E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans

  publish-containers:
    name: Publish ${{ matrix.service }} image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/competition/data-elements-education'
    needs:
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: services/api/Dockerfile
            image: ghcr.io/xvvln/clinical-osce-agent-api
            paths: services/api data/cases data/rubrics data/schemas data/attribution data/rag_knowledge data/humanistic_anchor_bank.yaml
          - service: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/xvvln/clinical-osce-agent-web
            paths: apps/web
          - service: admin
            dockerfile: apps/admin/Dockerfile
            image: ghcr.io/xvvln/clinical-osce-agent-admin
            paths: apps/admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether this service changed
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          SERVICE_PATHS: ${{ matrix.paths }}
        run: |
          changed=true
          if [[ "${{ github.event_name }}" == "push" && -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            read -r -a service_paths <<< "${SERVICE_PATHS}"
            common_paths=(.dockerignore docker-compose.yml .github/workflows/ci.yml)
            if git diff --quiet "${BEFORE_SHA}" "${HEAD_SHA}" -- "${service_paths[@]}" "${common_paths[@]}"; then
              changed=false
            fi
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:competition-data-elements-education
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
          sbom: false

      - name: Reuse unchanged image for this commit
        if: steps.changes.outputs.changed != 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ matrix.image }}:${{ github.sha }}" \
            "${{ matrix.image }}:competition-data-elements-education"
