name: clinical-osce-agent

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
    environment:
      CLINICAL_OSCE_DEPLOYMENT_MODE: ${CLINICAL_OSCE_DEPLOYMENT_MODE:-local-demo}
      CLINICAL_OSCE_TRUSTED_BROWSER_ORIGINS: ${CLINICAL_OSCE_TRUSTED_BROWSER_ORIGINS:-http://localhost:3000,http://127.0.0.1:3001,http://127.0.0.1:8000}
      CLINICAL_OSCE_SERVER_MANAGED_MODEL_CONFIG: ${CLINICAL_OSCE_SERVER_MANAGED_MODEL_CONFIG:-true}
      CLINICAL_OSCE_ACCOUNT_MODEL_ALLOWED_HOSTS: ${CLINICAL_OSCE_ACCOUNT_MODEL_ALLOWED_HOSTS:-api.openai.com,api.anthropic.com,generativelanguage.googleapis.com}
      CLINICAL_OSCE_ALLOW_UNSAFE_ACCOUNT_MODEL_ENDPOINTS: ${CLINICAL_OSCE_ALLOW_UNSAFE_ACCOUNT_MODEL_ENDPOINTS:-false}
      CLINICAL_OSCE_ADMIN_EMAILS: ${CLINICAL_OSCE_ADMIN_EMAILS:-}
      CLINICAL_OSCE_DEMO_ADMIN_ENABLED: ${CLINICAL_OSCE_DEMO_ADMIN_ENABLED:-false}
      CLINICAL_OSCE_DEMO_ADMIN_EMAIL: ${CLINICAL_OSCE_DEMO_ADMIN_EMAIL:-}
      CLINICAL_OSCE_DEMO_ADMIN_PASSWORD: ${CLINICAL_OSCE_DEMO_ADMIN_PASSWORD:-}
      CLINICAL_OSCE_DEMO_STUDENT_ENABLED: ${CLINICAL_OSCE_DEMO_STUDENT_ENABLED:-false}
      CLINICAL_OSCE_DEMO_STUDENT_EMAIL: ${CLINICAL_OSCE_DEMO_STUDENT_EMAIL:-}
      CLINICAL_OSCE_DEMO_STUDENT_PASSWORD: ${CLINICAL_OSCE_DEMO_STUDENT_PASSWORD:-}
      OSCE_GEMINI_PATIENT_USE_VERTEX: ${OSCE_GEMINI_PATIENT_USE_VERTEX:-false}
      OSCE_GEMINI_PATIENT_API_KEY: ${OSCE_GEMINI_PATIENT_API_KEY:-}
      OSCE_GEMINI_PATIENT_MODEL: ${OSCE_GEMINI_PATIENT_MODEL:-}
      OSCE_GEMINI_PATIENT_PROXY_URL: ${OSCE_GEMINI_PATIENT_PROXY_URL:-}
      OSCE_VERTEX_ENABLED: ${OSCE_VERTEX_ENABLED:-false}
      OSCE_VERTEX_SKILL_CANDIDATE_ENABLED: ${OSCE_VERTEX_SKILL_CANDIDATE_ENABLED:-false}
      OSCE_OPENAI_ENABLED: ${OSCE_OPENAI_ENABLED:-false}
      OSCE_OPENAI_API_KEY: ${OSCE_OPENAI_API_KEY:-}
      OSCE_OPENAI_BASE_URL: ${OSCE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OSCE_OPENAI_MODEL: ${OSCE_OPENAI_MODEL:-}
      OSCE_OPENAI_PROXY_URL: ${OSCE_OPENAI_PROXY_URL:-}
      OSCE_OPENAI_FALLBACK_ENABLED: ${OSCE_OPENAI_FALLBACK_ENABLED:-false}
      OSCE_OPENAI_FALLBACK_API_KEY: ${OSCE_OPENAI_FALLBACK_API_KEY:-}
      OSCE_OPENAI_FALLBACK_BASE_URL: ${OSCE_OPENAI_FALLBACK_BASE_URL:-}
      OSCE_OPENAI_FALLBACK_MODEL: ${OSCE_OPENAI_FALLBACK_MODEL:-}
      OSCE_OPENAI_FALLBACK_PROXY_URL: ${OSCE_OPENAI_FALLBACK_PROXY_URL:-}
      OSCE_LOCAL_EMBEDDING_ENABLED: ${OSCE_LOCAL_EMBEDDING_ENABLED:-true}
      OSCE_LOCAL_EMBEDDING_MODEL: ${OSCE_LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      OSCE_LOCAL_EMBEDDING_DEVICE: ${OSCE_LOCAL_EMBEDDING_DEVICE:-cpu}
      OSCE_LOCAL_EMBEDDING_CACHE_FOLDER: ${OSCE_LOCAL_EMBEDDING_CACHE_FOLDER:-/app/data/runtime/fastembed}
      OSCE_LOCAL_EMBEDDING_BATCH_SIZE: ${OSCE_LOCAL_EMBEDDING_BATCH_SIZE:-16}
      OSCE_CHROMA_ENABLED: ${OSCE_CHROMA_ENABLED:-true}
      CHROMA_PERSIST_DIRECTORY: ${CHROMA_PERSIST_DIRECTORY:-/app/data/runtime/chroma}
      OSCE_CHROMA_COLLECTION: ${OSCE_CHROMA_COLLECTION:-clinical_osce_retrieval}
      OSCE_CHROMA_SEARCH_EF: ${OSCE_CHROMA_SEARCH_EF:-500}
      HF_HOME: ${HF_HOME:-/app/data/runtime/huggingface}
      FASTEMBED_CACHE_PATH: ${FASTEMBED_CACHE_PATH:-/app/data/runtime/fastembed}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    ports:
      - "${CLINICAL_OSCE_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ./data/runtime:/app/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmjs.org}
        CLINICAL_OSCE_WEB_API_URL: http://api:8000
        NEXT_PUBLIC_CLINICAL_OSCE_DEPLOYMENT_MODE: ${NEXT_PUBLIC_CLINICAL_OSCE_DEPLOYMENT_MODE:-local-demo}
    environment:
      CLINICAL_OSCE_WEB_API_URL: http://api:8000
      NEXT_PUBLIC_CLINICAL_OSCE_DEPLOYMENT_MODE: ${NEXT_PUBLIC_CLINICAL_OSCE_DEPLOYMENT_MODE:-local-demo}
    ports:
      - "${CLINICAL_OSCE_BIND_HOST:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmjs.org}
        CLINICAL_OSCE_ADMIN_API_URL: http://api:8000
    environment:
      CLINICAL_OSCE_ADMIN_API_URL: http://api:8000
    ports:
      - "${CLINICAL_OSCE_BIND_HOST:-127.0.0.1}:3001:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
